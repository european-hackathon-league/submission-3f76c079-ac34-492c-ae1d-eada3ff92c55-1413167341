<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1200" height="430" fill="#0a0b0d"/>
  <rect width="1200" height="6" fill="#ff6a10"/>
  <text x="60" y="62" fill="#ff7a1f" font-size="15" font-weight="700" letter-spacing="1.5">HOW A MOVE IS MADE</text>
  <text x="60" y="100" fill="#f5f5f5" font-size="30" font-weight="700">Code computes. The model decides. Code checks.</text>

  <!-- steps -->
  <g font-size="14">
    <g transform="translate(60,140)">
      <rect width="196" height="150" rx="16" fill="#17181c" stroke="#5a3a26" stroke-width="2"/>
      <text x="20" y="38" fill="#ff7a1f" font-size="15" font-weight="700">01</text>
      <text x="20" y="66" fill="#f5f5f5" font-size="17" font-weight="700">Supplier e-mail</text>
      <text x="20" y="96" fill="#a0a0a5">quote, terms,</text>
      <text x="20" y="116" fill="#a0a0a5">claims, attachments</text>
    </g>
    <g transform="translate(286,140)">
      <rect width="196" height="150" rx="16" fill="#17181c" stroke="#5a3a26" stroke-width="2"/>
      <text x="20" y="38" fill="#ff7a1f" font-size="15" font-weight="700">02</text>
      <text x="20" y="66" fill="#f5f5f5" font-size="17" font-weight="700">Checked evidence</text>
      <text x="20" y="96" fill="#a0a0a5">contracts, indices,</text>
      <text x="20" y="116" fill="#a0a0a5">orders, notes — by ID</text>
    </g>
    <g transform="translate(512,140)">
      <rect width="196" height="150" rx="16" fill="#17181c" stroke="#5a3a26" stroke-width="2"/>
      <text x="20" y="38" fill="#ff7a1f" font-size="15" font-weight="700">03</text>
      <text x="20" y="66" fill="#f5f5f5" font-size="17" font-weight="700">Priced board</text>
      <text x="20" y="96" fill="#a0a0a5">11 cost components,</text>
      <text x="20" y="116" fill="#a0a0a5">rules, valid packages</text>
    </g>
    <g transform="translate(738,140)">
      <rect width="196" height="150" rx="16" fill="#ff6a10"/>
      <text x="20" y="38" fill="#0a0b0d" font-size="15" font-weight="700">04</text>
      <text x="20" y="66" fill="#0a0b0d" font-size="17" font-weight="700">LLM chooses</text>
      <text x="20" y="96" fill="#1a1006">move, packages,</text>
      <text x="20" y="116" fill="#1a1006">≤ 2 arguments, text</text>
    </g>
    <g transform="translate(964,140)">
      <rect width="176" height="150" rx="16" fill="#17181c" stroke="#ff6a10" stroke-width="2"/>
      <text x="20" y="38" fill="#ff7a1f" font-size="15" font-weight="700">05</text>
      <text x="20" y="66" fill="#f5f5f5" font-size="17" font-weight="700">Check &amp; send</text>
      <text x="20" y="96" fill="#a0a0a5">live IDs, must-haves,</text>
      <text x="20" y="116" fill="#a0a0a5">verified figures</text>
    </g>
  </g>
  <g fill="#ff6a10">
    <path d="M262 215 l14 0 l-6 -6 m6 6 l-6 6" stroke="#ff6a10" stroke-width="2.5" fill="none"/>
    <path d="M488 215 l14 0 l-6 -6 m6 6 l-6 6" stroke="#ff6a10" stroke-width="2.5" fill="none"/>
    <path d="M714 215 l14 0 l-6 -6 m6 6 l-6 6" stroke="#ff6a10" stroke-width="2.5" fill="none"/>
    <path d="M940 215 l14 0 l-6 -6 m6 6 l-6 6" stroke="#ff6a10" stroke-width="2.5" fill="none"/>
  </g>

  <!-- model chain -->
  <line x1="60" y1="330" x2="1140" y2="330" stroke="#2a2b30" stroke-width="1"/>
  <text x="60" y="368" fill="#ff7a1f" font-size="13" font-weight="700" letter-spacing="1.2">MODEL CHAIN</text>
  <g font-size="14" fill="#f5f5f5">
    <rect x="190" y="350" width="150" height="28" rx="14" fill="none" stroke="#ff6a10" stroke-width="1.5"/>
    <text x="210" y="369">gpt-5-mini · Azure</text>
    <text x="352" y="369" fill="#ff6a10">→</text>
    <rect x="378" y="350" width="214" height="28" rx="14" fill="none" stroke="#5a3a26" stroke-width="1.5"/>
    <text x="394" y="369">gpt-oss / DeepSeek · HF</text>
    <text x="604" y="369" fill="#ff6a10">→</text>
    <rect x="630" y="350" width="104" height="28" rx="14" fill="none" stroke="#5a3a26" stroke-width="1.5"/>
    <text x="648" y="369">Gemini</text>
    <text x="746" y="369" fill="#ff6a10">→</text>
    <rect x="772" y="350" width="214" height="28" rx="14" fill="none" stroke="#5a3a26" stroke-width="1.5"/>
    <text x="788" y="369">board fallback · code</text>
  </g>
  <text x="60" y="408" fill="#8c8c91" font-size="12.5">Any provider error (rate limit, exhausted credits, timeout, invalid answer) moves to the next step — a session never stops on an API problem.</text>
</svg>
